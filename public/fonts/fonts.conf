<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>__FONT_DIR__</dir>
  <include ignore_missing="yes">/opt/homebrew/etc/fonts/fonts.conf</include>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <!-- Alias: Impact & 'Jakarta Sans' → font bundled terdekat -->
  <match target="pattern">
    <test name="family"><string>Impact</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Anton</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Jakarta Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Plus Jakarta Sans</string></edit>
  </match>
</fontconfig>
